[project]
name = "gypsum_dl"
dynamic = ["version"]
description = "Open-source tool to generate 3D-ready small molecules for virtual screening"
authors = [
    {name = "durrantlab", email = "durrantj@pitt.edu"},
]
readme = "README.md"
requires-python = ">=3.10"

# TODO: Keep this here until pixi releases building capabilities
dependencies = [
    "loguru>=0.7.2,<1",
    "numpy>=2.0.0,<3",
    "scipy>=1.15.1,<2",
    "rdkit>=2024.9.4,<2027",
    "molvs>=0.1.1,<1",
    "dimorphite-dl>=2.0.1,<3",
]

# Building mpi4py requires mpicc and MPI headers, which a plain laptop or
# container does not have. parallelizer.py is written to degrade gracefully
# when mpi4py is absent and only raises when job_manager is set to mpi, so
# requiring it unconditionally broke "pip install gypsum-dl" for everyone who
# does not use mpi mode. Keep the pin in step with MIN_MPI4PY_VERSION in
# parallelizer.py and with pixi.toml.
[project.optional-dependencies]
mpi = ["mpi4py>=4.0.1,<5"]

[project.scripts]
gypsum-dl = "gypsum_dl.run:main"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gypsum_dl*"]

[tool.setuptools_scm]
write_to = "gypsum_dl/_version.py"
version_scheme = "guess-next-dev"
#local_scheme = "node-and-timestamp"
local_scheme = "no-local-version" 


